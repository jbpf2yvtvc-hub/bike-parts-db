name: Deploy (Cloudflare Pages)

# Cloudflare Pages also auto-deploys on push when the repo is connected in the
# dashboard (§8.3). This workflow is the explicit, reproducible path.
#
# It only runs the actual deploy when the Cloudflare credentials are present as
# repo secrets — otherwise every step is skipped and the job passes with a
# notice, so unconfigured repos don't get failing runs. To enable deploys, add
# these in Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (Pages:Edit token)
#   CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set. Add them in Settings → Secrets and variables → Actions to enable Cloudflare Pages deploys."
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.ok == 'true'

      - uses: actions/setup-node@v6
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        if: steps.guard.outputs.ok == 'true'
        run: npm ci
        working-directory: client

      - name: Build
        if: steps.guard.outputs.ok == 'true'
        run: npm run build
        working-directory: client

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Adjust the project name to match your Cloudflare Pages project.
          command: pages deploy client/.svelte-kit/cloudflare --project-name=bike-parts-db
